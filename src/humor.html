<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<script>/* The chosen color, before the page draws, so it does not flash another color. */
document.documentElement.dataset.theme = 'dark';
try { document.documentElement.dataset.theme = localStorage.getItem('newsShorts.humor.theme') || 'dark'; } catch (e) {}</script>
<title>Reply News</title>
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700;900&family=Tinos:wght@700&display=swap" rel="stylesheet">
<style>
/* White: the page is white and the buttons, links and lit buttons are gray. */
:root { --bg:#ffffff; --card:#f1f2f4; --line:#d9dbe0; --ink:#16181c; --mute:#62666d; --acc:#6b7078; --field:#ffffff; --on:#ffffff; --frame:#f2f3f5; }
/* Colors, chosen in Settings. Dark is the default (set on the page before it draws). */
:root[data-theme="beige"] { --bg:#f7f1e6; --card:#fffaf2; --line:#e4d8c4; --ink:#1c140c; --mute:#6d6458; --acc:#9a5b12; --field:#ffffff; --on:#fffaf2; --frame:#f4efe4; }
:root[data-theme="pink"] { --bg:#fff6f9; --card:#ffffff; --line:#f2d4df; --ink:#2b1620; --mute:#7c5e6a; --acc:#d6457a; --field:#ffffff; --on:#ffffff; --frame:#fdeef3; }
:root[data-theme="sky"] { --bg:#f3f8fd; --card:#ffffff; --line:#d3e2f2; --ink:#10202f; --mute:#58697a; --acc:#2a7bc8; --field:#ffffff; --on:#ffffff; --frame:#eaf2fa; }
:root[data-theme="mint"] { --bg:#f2fbf7; --card:#ffffff; --line:#cfe9dd; --ink:#11231b; --mute:#56706a; --acc:#1f9a6a; --field:#ffffff; --on:#ffffff; --frame:#e6f5ee; }
:root[data-theme="dark"] { --bg:#111214; --card:#1b1c1f; --line:#2d2f34; --ink:#f1f2f4; --mute:#9ea3ab; --acc:#f0c36b; --field:#15161a; --on:#151515; --frame:#1b1c1f; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Noto Sans JP","Hiragino Sans",system-ui,sans-serif; overscroll-behavior-y: none; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 8px; position: sticky; top: 0; z-index: 40; background: var(--bg); touch-action: none; }
button.title { background: none; border: 0; padding: 0; color: var(--ink); font: 700 20px/1.2 "Noto Serif JP",serif; cursor: pointer; }
a.jump { color: var(--acc); font: 700 14px/1 "Noto Sans JP",sans-serif; text-decoration: none; }
.hright { display: flex; align-items: center; gap: 12px; }
#gear { width: 48px; height: 44px; padding: 0; font-size: 22px; line-height: 1; touch-action: manipulation; }
#gear.on { background: var(--acc); border-color: var(--acc); color: var(--on); }
main { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
/* The portrait video is as tall as the screen allows, leaving room for the title and the buttons. */
.frame { width: min(100%, max(280px, calc((100vh - 150px) * 9 / 16))); width: min(100%, max(280px, calc((100dvh - 150px) * 9 / 16))); }
.ctl, .seekrow, .caption, .music, .music-label { max-width: 560px; margin-left: auto; margin-right: auto; }
.frame { position: relative; max-width: 100%; margin: 0 auto; transition: transform .18s ease; }
.frame.pulling { transition: none; }
/* PC layout: landscape, as wide as the page and the screen height allow. */
.land .frame { width: min(100%, max(320px, calc((100vh - 150px) * 16 / 9))); width: min(100%, max(320px, calc((100dvh - 150px) * 16 / 9))); }
.land canvas#cv { aspect-ratio: 16 / 9; }
canvas#cv { position: relative; z-index: 1; display: block; width: 100%; aspect-ratio: 9 / 16; height: auto; background: var(--frame); border-radius: 12px; }
/* iPhone: a copy of the picture as a video, behind the canvas, for the system full-screen player. */
/* A tap or click on the picture pauses and plays. */
canvas#cv { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
video#fsv { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; border-radius: 12px; background: var(--frame); }
/* Full screen: the class is set for the browser's full screen and for the page's own full screen. */
.watch.is-full { background: var(--bg); width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); box-sizing: border-box; }
.watch.is-full .frame { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; width: 100%; }
.watch.is-full canvas#cv { width: 100%; height: 100%; object-fit: contain; aspect-ratio: auto; border-radius: 0; }
.watch.is-full .ctl { flex: none; width: 100%; max-width: 640px; }
.watch.is-full .ctl #update { background: var(--acc); border-color: var(--acc); color: var(--on); }
.watch.is-full .seekrow { flex: none; width: 100%; max-width: 640px; }
.watch.is-full .linkbox { flex: none; }
.watch.is-full .source-url { flex: none; }
.watch.pseudo { position: fixed; top: 0; left: 0; z-index: 100; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
body.lock { overflow: hidden; }
/* The post's link: always shown, large and easy to tap. */
.source-url { display: block; width: fit-content; max-width: 100%; margin: 6px auto 0; padding: 8px 10px; color: var(--acc); font-size: 26px; line-height: 1.3; text-align: center; word-break: break-all; text-decoration: underline; text-underline-offset: 4px; border-radius: 8px; touch-action: manipulation; }
.source-url:active { background: var(--card); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.ctl button { white-space: nowrap; padding: 10px 11px; font-size: 14px; }
/* Music: lit while the music is on. */
button#sound.on { background: var(--acc); border-color: var(--acc); color: var(--on); }
/* On a narrow phone the seek bar and time move to a second row instead of running off the screen. */
.ctl input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--acc); }
/* The seek bar has its own row, so buttons whose words change (Play / Pause) never move it. */
.seekrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.seekrow input[type=range] { flex: 1 1 auto; min-width: 0; margin: 0; accent-color: var(--acc); }
.seekrow span { flex: none; color: var(--mute); font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; font-size: 13px; }
/* Play/Pause and Update/Creating keep one width, so the buttons stay on one row and in place. */
#play, #update { min-width: 5.4em; }
/* Download is an arrow now, so it is as narrow as its mark and the five buttons fit on one row. */
#dl { min-width: 2.8em; }
@media (max-width: 480px) { .ctl { gap: 6px; } .ctl button { padding: 9px 8px; font-size: 13px; } }
/* The link keeps the same height for every story, so nothing below it moves. */
.linkbox { height: calc(2 * 1.3 * 26px + 22px); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.linkbox .source-url { margin: 0 auto; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
@media (min-width: 820px) { .linkbox { height: calc(1.3 * 26px + 22px); } .linkbox .source-url { -webkit-line-clamp: 1; } }
button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 15px "Noto Sans JP",sans-serif; padding: 11px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
button:disabled { opacity: .45; cursor: default; }
.music button.on, .row button.on, #genreChips button.on, #xAccounts button { background: var(--acc); border-color: var(--acc); color: var(--on); }
.caption { text-align: center; color: var(--mute); font-size: 13px; margin-top: 10px; margin-bottom: 0; }
.caption.err { color: #9a3b28; }
.caption:empty { display: none; }
/* The panel that comes up when the downloaded video is ready (see handOver). */
.share { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
.share-card { width: 100%; max-width: 420px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.share-title { margin: 0 0 2px; text-align: center; font-weight: 700; font-size: 17px; }
.share-note { margin: 0; text-align: center; color: var(--mute); font-size: 13px; }
.share-card button, .share-card a { display: block; width: 100%; padding: 13px 12px; font-size: 16px; text-align: center; text-decoration: none; border-radius: 10px; }
.share-card a { border: 1px solid var(--line); color: var(--ink); }
.share-card .share-main { background: var(--acc); border-color: var(--acc); color: #111; font-weight: 700; }
.terms-foot { text-align: center; margin: 28px auto 0; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); font-size: 13px; }
.terms-foot a { color: var(--mute); text-decoration: underline; }
#sprog i { display: block; height: 100%; width: 0; background: var(--acc); }
.music-label { text-align: center; color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: 14px; margin-bottom: 4px; }
.music { display: flex; flex-wrap: wrap; gap: 6px; }
.music button { flex: 1 1 28%; padding: 8px 6px; font-size: 13px; }
/* The choices under the video (Items, Story length, Wallpaper, Music) are in three columns. */
#counts, #paces, #walls, #music { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
/* Settings: the same panel as the News page. */
.studio { display: grid; gap: 12px; margin-top: 16px; }
.studio:not([hidden]) { position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; top: var(--header-h, 64px); margin: 0; padding: 8px 16px calc(92px + env(safe-area-inset-bottom)); overflow: auto; background: var(--bg); }
.studio > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
.studio-bar { position: sticky; top: -8px; z-index: 2; padding: 12px 0 8px; margin-top: -8px; background: var(--bg); }
#backVideo, #lineupGo, #applyLine { width: 100%; }
.back-dock { position: fixed; z-index: 60; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); width: auto; background: var(--acc); color: var(--on); border-color: var(--acc); font-size: 17px; padding: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
#status { min-height: 1.6em; color: var(--ink); font-size: 14px; margin-top: 10px; white-space: pre-wrap; }
#status.err { color: #9a3b28; }
#sprog { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
details[open] { padding-bottom: 12px; }
summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
label { display: block; color: var(--mute); font-size: 13px; margin: 8px 0 4px; }
input[type=text], input[type=date], select, textarea { width: 100%; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 15px "Noto Sans JP",sans-serif; }
textarea { min-height: 260px; font: 12px/1.5 ui-monospace,Menlo,monospace; }
#lineup { min-height: 180px; }
#lineup.live { border-color: var(--acc); }
.check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; margin-top: 10px; }
.check input { width: 18px; height: 18px; accent-color: var(--acc); }
.filter-row:has(input:checked), .check:has(input:checked) { color: var(--acc); }
.note { color: var(--mute); font-size: 12px; margin: 6px 0 0; }
.filters { display: grid; gap: 6px; margin: 4px 0 8px; }
.source-group { color: var(--mute); font-size: 12px; margin: 14px 0 0; }
.x-add { display: flex; gap: 8px; align-items: center; }
.x-add input { flex: 1 1 auto; width: auto; }
.x-add button { flex: 0 0 auto; }
#xAccounts { margin-top: 8px; }
#xAccounts button, #genreChips button { flex: 0 1 auto; }
.filter-row { display: flex; align-items: center; gap: 8px; }
.filter-row .check { margin: 0; flex: 1; }
.filter-row select { width: 7.2em; }
button.primary { background: var(--acc); color: var(--on); border-color: var(--acc); width: 100%; font-size: 17px; padding: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.hides { margin-top: 12px; }
.hides button { flex: 1 1 40%; }
pre#sources { white-space: pre-wrap; font: 12px/1.5 ui-monospace,Menlo,monospace; color: var(--ink); margin: 0 0 8px; }
#out { display: none; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
#out.show { display: flex; }
#out .btn { flex: 1 1 30%; font-size: 14px; }
.set-title { margin: 0; font: 700 18px "Noto Serif JP",serif; color: var(--ink); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><div><button type="button" id="home" class="title">Reply News</button></div><div class="hright"><a class="jump" href="../">News</a><button type="button" id="gear" aria-label="Settings" aria-expanded="false">*</button></div></header>
<button type="button" id="backDock" class="back-dock" hidden>Back to video</button>
<main>
  <div id="watch" class="watch">
    <div class="frame">
      <canvas id="cv" width="1080" height="1920"></canvas>
    </div>
    <div class="linkbox"><a id="storyLink" class="source-url" href="" target="_blank" rel="noopener" hidden></a></div>
    <div class="ctl">
      <button id="play" disabled>Play</button>
      <button id="sound" type="button" class="on" aria-pressed="true">Music</button>
      <button id="full" type="button">Full screen</button>
      <button id="update" type="button">Update</button>
      <button id="dl" type="button" disabled aria-label="Download" title="Download">⬇️</button>
    </div>
    <div class="seekrow">
      <input type="range" id="seek" min="0" max="1000" value="0" disabled>
      <span id="time">0.0 / 0.0</span>
    </div>
  </div>
  <p id="caption" class="caption"></p>
  <p class="music-label">Items</p>
  <div class="music" id="counts"></div>
  <p class="music-label">Story length</p>
  <div class="music" id="paces"></div>
  <p class="music-label">Wallpaper</p>
  <div class="music" id="walls"></div>
  <p class="music-label">Music</p>
  <div class="music" id="music"></div>

  <div id="studio" class="studio" hidden>
    <div class="studio-bar"><button type="button" id="backVideo">Back to video</button></div>
    <section class="card" id="setBox">
      <p class="set-title">Reply News settings</p>
      <label for="layout">Layout</label>
      <select id="layout">
        <option value="auto">Auto</option>
        <option value="phone">Phone</option>
        <option value="x">X</option>
        <option value="youtube">YouTube</option>
        <option value="pc">PC</option>
      </select>
      <label for="theme">Color</label>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="white">White</option>
        <option value="beige">Beige</option>
        <option value="pink">Pink</option>
        <option value="sky">Sky blue</option>
        <option value="mint">Mint</option>
      </select>
      <label for="country">Country</label>
      <select id="country"></select>
      <label for="lang">Language</label>
      <select id="lang"></select>
      <label for="feed">Feed</label>
      <select id="feed">
        <option value="x">X comments only</option>
        <option value="news">News, then comments</option>
      </select>
      <label>Genres</label>
      <div id="genreChips" class="music"></div>
      <button type="button" id="lineupGo">Lineup</button>
      <textarea id="lineup" rows="8" spellcheck="false" placeholder="Politics&#10;Sports&#10;Romance&#10;Jokes"></textarea>
      <button id="applyLine" type="button">Apply lineup</button>
      <div class="music hides">
        <button type="button" id="hideSensitive" aria-pressed="false">Hide sensitive posts</button>
      </div>
      <label>Sources</label>
      <div id="sourceFilters" class="filters"></div>
      <label for="xUser">X accounts</label>
      <div class="x-add">
        <input id="xUser" type="text" autocomplete="username" spellcheck="false" placeholder="@name">
        <button type="button" id="addX">Add</button>
      </div>
      <div id="xAccounts" class="music"></div>
      <label for="date">Date</label>
      <input type="date" id="date">
      <label class="check"><input type="checkbox" id="autoExport"> Export MP4 files after the stories are ready</label>
      <label>Formats to export</label>
      <label class="check"><input type="checkbox" class="fx" value="x" checked> Phone and X (portrait 1080×1920)</label>
      <label class="check"><input type="checkbox" class="fx" value="youtube" checked> YouTube (portrait 1080×1920, room for buttons)</label>
      <label class="check"><input type="checkbox" class="fx" value="pc" checked> PC (landscape 1920×1080)</label>
      <button id="go" class="primary">Collect and play</button>
      <div id="status">Opening the humor video…</div>
      <div id="sprog"><i></i></div>
      <div id="out" class="row"></div>
      <label class="check"><input type="checkbox" id="forget"> Forget what has played (stories and jokes can play again)</label>
    </section>

    <details>
      <summary>Script (JSON)</summary>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="apply">Apply script</button>
        <button id="exportBtn" disabled>Export MP4</button>
      </div>
    </details>

    <details>
      <summary>Sources</summary>
      <pre id="sources"></pre>
      <button id="copySrc">Copy sources</button>
    </details>
  </div>
<footer class="terms-foot"><a href="../terms.html">Terms of Use</a></footer>
</main>
<div id="shareBox" class="share" hidden>
  <div class="share-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <p id="shareTitle" class="share-title">The video is ready</p>
    <button type="button" id="shareGo" class="share-main">Share or save (LINE, X…)</button>
    <a id="shareX" target="_blank" rel="noopener">Post on X</a>
    <a id="shareLine" target="_blank" rel="noopener">Send by LINE</a>
    <p id="shareNote" class="share-note"></p>
    <button type="button" id="shareClose">Close</button>
  </div>
</div>

<script>
(() => {
'use strict';
const ASSETS = /*__ASSETS__*/;
const E = window.NSEngine;
const $ = id => document.getElementById(id);
const ctx = $('cv').getContext('2d');
const Q = new URLSearchParams(location.search);
const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const WATCH = Q.get('watch') !== '0' && !REDUCE;
const store = {
  get(k, d) { try { const v = localStorage.getItem('newsShorts.humor.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('newsShorts.humor.' + k, v); } catch (e) {} },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
/* Items: how many cards one video plays. Chosen under the video. */
const COUNTS = [5, 10, 20];
const MAX_ITEMS = 24;
/* Every card in a video gets the same headline size, and the Japanese lines below it are twice the usual size. */
/* lang: the date line at the top is in the chosen language only. */
const LOOK = { uniform: true, jp: 2, get lang() { const el = document.getElementById('lang'); return el && el.value === 'en' ? 'en' : 'ja'; } };

/* ---------- the same choices as the News page ---------- */
const FORMATS = { x: 'Phone', youtube: 'YouTube', pc: 'PC' };
/* PC uses the wide single-column layout, which keeps the large Japanese text whole. */
const PRESET = { x: 'x', youtube: 'youtube', pc: 'wide' };
const COUNTRIES = [
  { id: 'JP', name: 'Japan', lang: 'ja' },
  { id: 'US', name: 'United States', lang: 'en' },
];
const LANGS = [
  { id: 'en', name: 'English' },
  { id: 'ja', name: 'Japanese' },
];
const WALLS = [
  { id: 'morning', name: 'Morning' },
  { id: 'bright', name: 'Bright' },
  { id: 'day', name: 'Day' },
  { id: 'evening', name: 'Evening' },
  { id: 'night', name: 'Night' },
  { id: 'pop', name: 'Pop' },
];
function total() {
  const n = Number(store.get('count', '10'));
  return COUNTS.includes(n) ? n : 10;
}
/* Split n over k lines: as even as possible, the first lines get the extra ones. */
function shares(n, k) {
  return Array.from({ length: k }, (_, i) => Math.floor(n / k) + (i < n % k ? 1 : 0));
}
/* Lineup lines are names only; an old count after the name is dropped. */
function noCount(line) {
  return String(line || '').replace(/^\s*\d+\s*[\.\)、]\s*/, '').replace(/\s*[,、]?\s*\d+\s*(?:個|件|本)?\s*$/, '').trim();
}
const PACES = [
  { sec: 3.2, name: '3.2s' },
  { sec: 4.2, name: '4.2s' },
  { sec: 5.2, name: '5.2s' },
];
/* Three songs. 1 is inside the page; 2 and 3 load from ../assets/ the first time they are chosen. Each repeats
   on its own, without a seam. loop: the length of the song (8 bars; 1 and 3 at 90 BPM, 2 at 110 BPM), a whole
   number of AAC frames; each file holds it twice. */
const TRACKS = [
  { id: '1', name: '1', file: '', loop: 1000 * 1024 / 48000, credit: 'Music: 1' },
  { id: '2', name: '2', file: 'song_2.m4a', loop: 818 * 1024 / 48000, credit: 'Music: 2' },
  { id: '3', name: '3', file: 'song_3.m4a', loop: 1000 * 1024 / 48000, credit: 'Music: 3' },
];
const VIOLENT = /murder|stabbed|shot dead|shooting|killed|beheading|homicide|massacre|rape|sexual assault|robbery|凶悪|殺人|殺害|刺殺|遺体|刺され|死傷|銃乱射|暴行|強盗|レイプ|強姦/i;
const GENRES = [

function rssItems(xml) {
  const items = [];
  const re = /<item\b[^>]*>([\s\S]*?)<\/item>/g;

  const decode = s => String(s || '').replace(/<!\[CDATA\[|\]\]>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").trim();
  while ((m = re.exec(xml))) {
    const block = m[1];
    const title = decode((block.match(/<title>([\s\S]*?)<\/title>/) || [])[1]);
    const link = decode((block.match(/<link>([\s\S]*?)<\/link>/) || [])[1] || (block.match(/<link\b[^>]*rdf:resource="([^"]+)"/) || [])[1] || (block.match(/<guid[^>]*>([\s\S]*?)<\/guid>/) || [])[1]);
    const pubDate = decode((block.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1] || (block.match(/<dc:date>([\s\S]*?)<\/dc:date>/) || [])[1]);
    if (title) items.push({ title, link, pubDate });
  }

}
/* A feed is read through a relay, and there are three of them, because each refuses some sites and each
   has bad hours: rss2json reads Google News, Bing News, the BBC and ABC; allorigins reads Yahoo! News,
   Bing News, the BBC and ABC; r.jina.ai reads Yahoo! News, the BBC and ABC. For each site the relay
   that reads it best is asked first; the next one starts when the one before fails, or after two and a
   half seconds without an answer; the first that returns stories is used. A relay that failed for a
   site is left out for that site for ten minutes; while every relay is out for a site, that site is
   passed over. (The same as on the News page.) */

function realLink(link) {

const RELAYS = {
  rss2json: { ms: 9000, get: async rss => {

    if (!res.ok) throw new Error('rss2json ' + res.status);
    const j = await res.json();
    if (!j || j.status !== 'ok') throw new Error('rss2json could not read it');
    return j.items || [];
  } },
  allorigins: { ms: 10000, get: async rss => {
    const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(rss));
    if (!res.ok) throw new Error('allorigins ' + res.status);

  jina: { ms: 10000, get: async rss => {

    if (!res.ok) throw new Error('jina ' + res.status);

  if (!order.length) return Promise.resolve([]);

}

/* ---------- two cards for each comment ---------- */
/* The first card shows the short part (すごーい), the second the whole comment
   (兼六園の雪吊りすごーい). Only the posted words are shown, with no added explanation. */
const REACT = {
  ja: /(?:すご[ーぉおいっ〜~]*い?|すげ[ーぇえっ]*|スゴ[ーイい]*|やば[いぁーっ]*|ヤバ[いイー]*|かわい[いー〜]*|可愛[いー]*|きれ[いー]+|綺麗|キレイ|美し[いー]*|最高|さいこう|絶景|感動|圧巻|エモ[いー]*|尊[いー]*|うま[いー]+|美味し[いー]*|おいし[いー]*|楽し[いー]*|たのし[いー]*|ワロタ|爆笑|笑笑|ウケる|面白[いー]*|おもしろ[いー]*|草)[^、。！？!?\n]{0,6}[！!？?〜~ーｗw笑✨♪…]*[\s\p{Extended_Pictographic}‍️]*$/u,
  en: /\b(?:wow+|omg|amazing|stunning|beautiful|gorgeous|breathtaking|incredible|insane|lol+|lmao+|haha\w*)\b[^.!?\n]{0,20}[.!?]*[\s\p{Extended_Pictographic}‍️]*$/iu,
};
function teaserOf(text, lang) {
  const t = String(text || '').trim();
  const n = charLen(t);
  const fits = x => x && charLen(x) >= 2 && charLen(x) <= (lang === 'en' ? 40 : 14) && charLen(x) <= n - 3;
  const m = t.match(REACT[lang]);
  if (m && fits(m[0].trim())) return m[0].trim();
  const parts = (lang === 'en' ? t.replace(/([.!?])\s+/g, '$1\u0000').split('\u0000') : t.split(/[、。！？!?\s]+/)).map(x => x.trim()).filter(Boolean);
  const last = parts[parts.length - 1];
  if (parts.length > 1 && fits(last)) return last;
  return '';
}
function beats(r, card, langId) {
  const ja = langId !== 'en' && CJK.test(card.head.join('') + (card.jp[0] || ''));
  const text = ja ? (r._shownJa || r.headline) : (r._shownEn || r.headline);
  const lang = ja ? 'ja' : 'en';
  const corner = r.travel ? (ja ? '観光' : 'TRAVEL') : card.topic;
  const main = { ...card, topic: corner, cat: r.travel ? 'TRAVEL' : card.cat, jp: card.jp.slice(), _main: true };
  const tease = teaserOf(text, lang);
  if (tease) {
    const bare = tease.replace(/[\p{Extended_Pictographic}\u200d\ufe0f!！?？〜~…✨♪\s\d]/gu, '');
    const kw = bare && charLen(bare) <= 6 ? bare : (ja ? jaWord(tease) : storyWord(tease, ''));
    return [{ ...card, topic: corner, cat: main.cat, kw, head: [tease], sub: [], jp: [] }, main];
  }
  return [main];
}

/* ---------- text for the picture ---------- */
async function translateMany(texts, tl) {
  const sep = '\n###\n';
  const out = texts.slice();
  for (let i = 0; i < texts.length; i += 5) {
    const slice = texts.slice(i, i + 5);
    try {
      const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + encodeURIComponent(tl) + '&dt=t&q=' + encodeURIComponent(slice.join(sep));
      const data = JSON.parse(await getText(url, 10000));
      const joined = (data[0] || []).map(row => (row && row[0]) || '').join('');
      const parts = joined.split(/\s*###\s*/);
      slice.forEach((src, k) => { out[i + k] = ((parts[k] || src).trim() || src); });
    } catch (e) { console.warn(e); }
  }
  return out;
}
function contentWords(text) {
  return String(text || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').split(/\s+/).filter(w => w.length > 1 && !SMALL.has(w.toLowerCase()));
}
function storyWord(english, local) {
  const genreNames = new Set(GENRES.map(g => g.name.toUpperCase().replace(/[^A-Z0-9]/g, '')));
  const words = contentWords(english).filter(w => !STOP.has(w) && !genreNames.has(w) && w !== 'NEWS');
  const strong = words.filter(w => w.length >= 5);
  const raw = ((strong[0] || words[0]) || '').replace(/[^A-Z0-9]/g, '');
  if (raw) return raw.length > 16 ? raw.slice(0, 16) : raw;
  const cjk = String(local || english || '').match(/[぀-ヿ一-鿿]{2,}/);
  return cjk ? cjk[0].slice(0, 6) : 'UPDATE';
}
function jaWord(text) {
  const katas = String(text || '').match(/[゠-ヿ]{2,8}/g) || [];
  if (katas.length) return katas.sort((a, b) => b.length - a.length)[0].slice(0, 8);
  const kanji = String(text || '').match(/[一-鿿]{2,4}/);
  if (kanji) return kanji[0];
  const kana = String(text || '').match(/[぀-ゟ]{2,6}/);
  return kana ? kana[0] : 'NEWS';
}
function largeJa(text) {
  const chars = [...String(text || '').replace(/\s+/g, ' ').trim()];
  if (!chars.length) return { head: ['NEWS'], rest: '' };
  const cap = Math.min(chars.length, 36);
  const take = chars.slice(0, cap);
  const rest = chars.slice(cap).join('').trim();
  if (take.length <= 16) return { head: [take.join('')], rest };
  let mid = Math.ceil(take.length / 2);
  const breaks = [];
  for (let i = 8; i <= take.length - 6; i++) {
    if (take[i] === ' ' || /[、。！？とでをはがに]/.test(take[i - 1])) breaks.push(i);
  }
  if (breaks.length) mid = breaks.sort((a, b) => Math.abs(a - mid) - Math.abs(b - mid))[0];
  return { head: [take.slice(0, mid).join('').trim(), take.slice(mid).join('').trim()].filter(Boolean), rest };
}
function monthDay(stamp) {
  if (!stamp) return '';
  const s = String(stamp);
  const d = new Date(/^\d{14}$/.test(s) ? s.replace(/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)$/, '$1-$2-$3T$4:$5:$6Z') : s);
  return Number.isNaN(d.getTime()) ? '' : (d.getMonth() + 1) + '/' + d.getDate();
}
/* The same story card as the News page: Japanese large, or an English headline. */
function storyFrom(raw, english, local, langId) {
  const en = String(english || raw.headline || '').replace(/\s+/g, ' ').trim();
  const loc = String(local || '').replace(/\s+/g, ' ').replace(/^[、。，．\s]+/, '').trim();
  const jaText = loc || en;
  const cat = raw.cat && raw.cat !== 'NEWS' ? raw.cat : '';
  const src = (raw.x ? ('X @' + String(raw.source || 'X').replace(/^X\s*@/, '')) : (raw.source || 'News')).slice(0, 40);
  if (langId !== 'en' && CJK.test(jaText)) {
    const parts = largeJa(jaText);
    const kw = jaWord(jaText);
    const body = [];
    if (parts.rest) body.push(parts.rest);
    if (langId === 'both' && en && en !== jaText) body.push(en);
    return { kw, cat: cat || kw, topic: kw, head: parts.head.length ? parts.head : [kw], sub: [], jp: body, tags: [], src, date: monthDay(raw.pubDate), url: raw.link || '' };
  }
  const kw = storyWord(en, loc);
  const words = (en || loc || kw).split(/\s+/).filter(Boolean);
  const head = [words.slice(0, 12).join(' ') || kw];
  const sub = words.length > 12 ? [words.slice(12, 22).join(' ')] : [];
  let jp;
  if (langId === 'en') jp = en ? [en] : [];
  else if (langId === 'ja') jp = [loc || en].filter(Boolean);
  else { jp = [loc || en].filter(Boolean); if (en && en !== (loc || en)) jp.push(en); }
  return { kw, cat: cat || kw, topic: kw, head, sub, jp: jp.length ? jp : [kw], tags: [], src, date: monthDay(raw.pubDate), url: raw.link || '' };
}
/* Translate each row into the chosen language, then make the cards. */
/* The cards for each row, in the same order as the rows. Comments get two cards (see beats). */
async function cardsFrom(rows, langId) {
  const plain = rows.filter(r => !r.romance);
  const toJa = langId !== 'en' ? plain.filter(r => !CJK.test(r.headline)) : [];
  const toEn = langId !== 'ja' ? plain.filter(r => CJK.test(r.headline)) : [];
  if (toJa.length) (await translateMany(toJa.map(r => r.headline), 'ja')).forEach((t, i) => { toJa[i]._ja = t; });
  if (toEn.length) (await translateMany(toEn.map(r => r.headline), 'en')).forEach((t, i) => { toEn[i]._en = t; });
  return rows.map(r => {
    if (r.romance) return romanceCards(r, langId);
    const cjk = CJK.test(r.headline);
    const en = cjk ? (r._en || '') : r.headline;
    const ja = cjk ? r.headline : (r._ja || '');
    r._shownJa = ja; r._shownEn = en || r.headline;
    const card = storyFrom(r, en || r.headline, ja, langId);
    card.key = r.joke ? jokeKeys(r) : newsKeys(r);
    return r.joke ? beats(r, card, langId) : [card];
  });
}

/* ---------- making the video ---------- */
async function collect() {
  beginCollect();
  const { country, lang } = market();
  const mode = feedMode();
  const N = total();
  const slots = parseLineup(lineupText());
  /* The video is made of the stories githito.xapi prepared, whatever the lineup says: the page searches
     nothing itself (X is not asked from here), so it starts at once. With nothing prepared it says so. */
  {
    const rows = await preparedRows(Math.max(1, Math.floor(N / 2))).catch(e => { console.warn(e); return []; });
    if (S.again || !rows.length) return null;
    if (lang.id === 'en') await englishStories(rows);
    const items = rows.flatMap(r => romanceCards(r, lang.id)).slice(0, N);
    return { date: chosenDate(), items, market: country.name + ' · ' + lang.name, played: { news: [], jokes: rows.flatMap(r => r.keys) } };
  }
  const SPECIAL = new Set(['jokes', 'romance', 'travel']);
  const topicSlots = slots.filter(s => !SPECIAL.has(s.type));
  const used = new Set();
  let sequence = [];
  let jokeAt = -1;
  let topicWords = [];
  const topicPlace = {};
  /* Items (5, 10 or 20) is the number of cards. News, then comments gives about 40% to the reports.
     Each comment is two cards: the short part, then the whole comment.
     Romance adds couples (the post, the reply, what others said); Travel adds what people said
     at famous places. A lineup line asks for more of them; the genres, when the lineup has no
     topics, add a few. A lineup of only Romance and Travel plays only those. */
  const romanceSlot = slots.find(s => s.type === 'romance');
  const travelSlot = slots.find(s => s.type === 'travel');
  const romanceGenre = genreChoices().find(g => g.id === 'romance' && g.on);
  const travelGenre = genreChoices().find(g => g.id === 'travel' && g.on);
  const onlySpecial = slots.length > 0 && slots.every(s => s.type === 'romance' || s.type === 'travel');
  const newsNeed = mode === 'x' ? 0 : Math.max(1, Math.round(N * 0.4));
  const kinds = (romanceSlot ? 1 : 0) + (travelSlot ? 1 : 0);
  const share = onlySpecial ? Math.ceil((N - newsNeed) / kinds) : 0;
  const byGenre = !topicSlots.length;
  const romanceNeed = onlySpecial ? (romanceSlot ? Math.min(7, Math.ceil(share / 3)) : 0)
    : romanceSlot ? Math.max(1, Math.round(N / 6)) : (byGenre && romanceGenre) ? Math.max(1, Math.round(N / 10)) : 0;
  const travelNeed = onlySpecial ? (travelSlot ? Math.min(10, Math.ceil(share / 2)) : 0)
    : travelSlot ? Math.max(1, Math.round(N / 5)) : (byGenre && travelGenre) ? Math.max(1, Math.round(N / 10)) : 0;
  const romancePlace = romanceGenre ? romanceGenre.place : 'middle';
  const travelPlace = travelGenre ? travelGenre.place : 'middle';
  if (mode === 'x') {
    /* X comments only: no reports. Funny replies about the lineup, the accounts,
       and today's news in each chosen genre, in the genres' Top, Middle, Bottom order. */
    say('Searching X');
    progress(0.1);
    topicSlots.forEach(s => topicWords.push(s.who ? 'to:' + s.who : (s.topic || s.q || s.gdelt || s.label)));
    if (topicWords.length < 3 && !onlySpecial) {
      const chosen = shuffle(genreChoices().filter(g => g.on && g.id !== 'romance' && g.id !== 'travel')).slice(0, 6);
      const lists = await Promise.all(chosen.map(g => searchRows(g.q[country.id] || g.q.US, up(g.name)).then(rows => rows.filter(allowedRow)).catch(() => [])));
      chosen.forEach((g, i) => {
        lists[i].slice(0, 3).forEach(r => keywordsFor(r.headline, jokeLang()).forEach(w => { topicWords.push(w); topicPlace[w] = g.place; }));
      });
    }
    if (topicWords.length < 3 && !onlySpecial) {
      const news = await homeNews(new Set(), 8).catch(() => []);
      news.forEach(r => keywordsFor(r.headline, jokeLang()).forEach(w => topicWords.push(w)));
    }
    jokeAt = 0;
  } else if (topicSlots.length) {
    const parts = shares(newsNeed, topicSlots.length);
    topicSlots.forEach((s, i) => { s.count = parts[i]; });
    for (const slot of slots) {
      if (S.again || sequence.length >= MAX_ITEMS) break;
      if (slot.type === 'jokes') { jokeAt = sequence.length; continue; }
      if (slot.type === 'romance' || slot.type === 'travel') { if (jokeAt < 0) jokeAt = sequence.length; continue; }
      if (!slot.count) continue;
      say('Searching ' + (slot.label || slot.cat || 'news'));
      progress(0.08 + 0.4 * slots.indexOf(slot) / slots.length);
      let rows = freshRows(await rowsForSlot(slot), used);
      if (rows.length < slot.count && slot.type !== 'x') rows = mergeRows(rows, freshRows((await searchRows(slot.label, slot.cat)).filter(allowedRow), used));
      takeRows(shuffle(rows), used, slot.count, 0).forEach(r => sequence.push(r));
    }
  } else {
    sequence = await homeNews(used, newsNeed);
  }
  if (S.again) return null;
  sequence = sequence.slice(0, N);
  if (jokeAt < 0) jokeAt = sequence.length;
  const headlines = sequence.map(r => r.headline);
  if (mode !== 'x') sequence.forEach(r => keywordsFor(r.headline, jokeLang()).forEach(w => topicWords.push(w)));
  say('Searching jokes');
  progress(0.55);
  /* Jokes fill whatever the couples and places leave, so ask for enough to fill the rest on their own. */
  const left0 = Math.max(0, N - sequence.length);
  const [found, couples, trips] = await Promise.all([
    collectJokes(topicWords, onlySpecial ? 0 : left0, { headlines }),
    collectRomance(romanceNeed, romancePlace).catch(e => { console.warn(e); return []; }),
    collectTravel(travelNeed, travelPlace).catch(e => { console.warn(e); return []; }),
  ]);
  /* A comment found both as a joke and under a couple plays once, as the joke. */
  const jokeKeySet = new Set(found.flatMap(j => jokeKeys({ text: j.text, link: j.url })));
  const coupleKeys = r => [r.story.a, r.story.b, ...r.story.cheers].flatMap(m => ['id:' + m.id, 't:' + squash(m.text).slice(0, 50)]);
  couples.forEach(r => {
    r.story.cheers = r.story.cheers.filter(c => !jokeKeySet.has('id:' + c.id) && !jokeKeySet.has('t:' + squash(c.text).slice(0, 50)));
    r.keys = coupleKeys(r);
  });
  const jokeRows = found.map(j => ({ headline: j.text, text: j.text, link: j.url, source: j.source || ('X @' + j.handle), x: !j.source || /^X\b/.test(j.source), cat: 'HUMOR', joke: true, topic: j.topic, place: topicPlace[j.topic] || 'middle' }));
  const coupleRows = couples.map(r => ({ ...r, headline: r.story.a.text, joke: true }));
  if (S.again) return null;
  if (!sequence.length && !jokeRows.length && !coupleRows.length && !trips.length) return { empty: true };
  say('Reading the text');
  progress(0.75);
  /* Fit the cards to Items: reports, couples and places first, then jokes fill the rest.
     A comment without room for two cards keeps only the whole comment. */
  const all = sequence.concat(coupleRows, trips, jokeRows);
  const cards = await cardsFrom(all, lang.id);
  if (S.again) return null;
  let left = N;
  all.forEach((r, i) => {
    let c = cards[i];
    r._cards = null;
    if (!c.length || left <= 0) return;
    if (c.length > left) {
      if (r.romance) {
        if (left < 2) return;
        c = c.slice(0, left);
        r.story.cheers = r.story.cheers.slice(0, left - 2);
        r.keys = coupleKeys(r);
        c.forEach(card => { card.key = r.keys; });
      } else c = c.filter(card => card._main).slice(0, left);
    }
    if (!c.length) return;
    r._cards = c;
    left -= c.length;
  });
  /* Jokes, couples and places take turns within each band (Top, Middle, Bottom). */
  const band = { top: 0, middle: 1, bottom: 2 };
  const extra = [];
  ['top', 'middle', 'bottom'].forEach(b => {
    const lists = [jokeRows, coupleRows, trips].map(list => list.filter(r => r._cards && (band[r.place] === undefined ? 'middle' : r.place) === b));
    for (let k = 0; lists.some(l => l.length); k++) {
      const l = lists[k % lists.length];
      if (l.length) extra.push(l.shift());
    }
  });
  const news = sequence.filter(r => r._cards);
  const at = Math.min(jokeAt, news.length);
  const rows = news.slice(0, at).concat(extra, news.slice(at));
  const items = rows.flatMap(r => r._cards);
  return {
    date: chosenDate(), items, market: country.name + ' · ' + lang.name,
    played: { news: news.flatMap(newsKeys), jokes: extra.flatMap(j => j.keys || jokeKeys(j)) },
  };
}
function normItem(it) {
  const head = arr(it.head).map(up).slice(0, 3);
  return {
    kw: up(it.kw || (head[0] || '').split(' ')[0]).slice(0, 16) || 'NEWS',
    cat: up(it.cat || 'NEWS'), topic: up(it.topic || ''),
    head: head.length ? head : [up(it.kw) || 'NEWS'],
    sub: arr(it.sub).slice(0, 3).map(l => String(l).trim().split(/\s+/).map(w => SMALL.has(w.toLowerCase()) ? w.toLowerCase() : w.toUpperCase()).join(' ')),
    jp: arr(it.jp).slice(0, 8),
    tags: arr(it.tags).map(up).slice(0, 4),
    src: String(it.src || '').trim(), date: String(it.date || '').trim(), url: String(it.url || '').trim(),
    key: arr(it.key),

function normalize(s) {
  const items = (s.items || []).slice(0, MAX_ITEMS).filter(Boolean).map(normItem);

  const lines = s.items.map((it, i) => `${pad2(i + 1)} ${it.head.join(' ')} — ${it.src}${it.date ? ' (' + it.date + ')' : ''}${it.url ? '\n   ' + it.url : ''}`);
  return lines.join('\n') + '\n\n' + S.track.credit + '\nPhotos: U.S. National Park Service & NOAA, public domain';
}
async function loadFonts(script) {

  const link = document.getElementById('gf');
  if (link && !link.sheet) await Promise.race([new Promise(r => { link.addEventListener('load', r, { once: true }); link.addEventListener('error', r, { once: true }); }), sleep(8000)]);
  await Promise.race([
    Promise.all(['900 64px "Noto Serif JP"', '700 40px "Noto Serif JP"', '700 34px "Noto Sans JP"', '700 40px "Tinos"'].map(f => document.fonts.load(f, txt).catch(() => {}))).then(() => document.fonts.ready),
    sleep(12000),

/* ---------- playback ---------- */

}
function safeUrl(u) {

    const x = new URL(String(u || ''), location.href);
    return x.protocol === 'http:' || x.protocol === 'https:' ? x.href : '';
  } catch (e) { return ''; }
}
function draw(T) {
  if (!S.show) return;
  S.lastDraw = performance.now();
  const shown = Math.min(T, Math.max(0, S.show.duration - 1 / E.FPS));
  E.drawFrame(ctx, S.show, shown, S.bgs);
  $('time').textContent = `${T.toFixed(1)} / ${S.show.duration.toFixed(1)}`;
  const a = $('storyLink');
  const i = Math.min(S.show.items.length - 1, Math.max(0, Math.floor(shown / (E.DUR || 3.2))));
  const url = safeUrl(S.show.items[i] && S.show.items[i].url);
  if (!url) { if (!a.hidden) { a.hidden = true; a.removeAttribute('href'); a.textContent = ''; a.dataset.u = ''; } return; }
  a.hidden = false;
  /* Only when the story changes, so the link is not rebuilt on every frame while it is being tapped. */
  if (a.dataset.u !== url) { a.dataset.u = url; a.href = url; a.textContent = url.replace(/^https?:\/\//, ''); }
}

/* The music plays on its own and is not tied to the video: a new video, Update, the video repeating, Pause,

  const news = items.length - jokes;
  const what = news && jokes ? `${news} ${news === 1 ? 'story' : 'stories'}, then ${jokes} ${jokes === 1 ? 'comment' : 'comments'}` : (jokes ? `${jokes} ${jokes === 1 ? 'comment' : 'comments'}` : `${news} ${news === 1 ? 'story' : 'stories'}`);

function beginPlayback(T0) {

    const CH = 384 * 1024;
    for (let i = 0; i < bytes.length; i += CH) {
      const part = bytes.subarray(i, i + CH);
      let bin = '';
      for (let j = 0; j < part.length; j += 0x8000) bin += String.fromCharCode.apply(null, part.subarray(j, j + 0x8000));
      if (!app.saveChunk(btoa(bin))) throw new Error('Could not save the video.');
      if (i % (CH * 8) === 0) await sleep(0);
    }
    const where = app.saveEnd();
    if (!where) throw new Error('Could not save the video.');
    say(`Saved to ${where}`);
  } catch (e) {
    console.error(e);
    say(e.message || String(e), true);
  }
  resetDownload();
}
/* The video is ready: hand it over. */
async function handOver(out) {
  resetDownload();
  if (window.AndroidApp && window.AndroidApp.saveStart) { saveToApp(out); return; }
  if (PHONE && shareFile(out)) {
    if (await openSheet(out)) return;
    openShare(out, false);
    return;
  }
  keepFile(out);
  openShare(out, true);
}
async function download() {
  if (!S.script || S.busy) return;
  const fmt = S.format;
  const mine = () => S.outs.find(o => o.fmt === fmt && o.script === S.script && !!o.mute === !!S.mute);
  if (mine()) { handOver(mine()); return; }
  const was = S.playing;
  const b = $('dl');
  b.textContent = 'Making MP4…';
  try { await exportMP4([fmt]); }
  catch (e) { console.error(e); resetDownload(); say(e.message || String(e), true); return; }
  const out = mine();
  resetDownload();
  if (!out) return;
  if (was && !S.playing) toggle();
  handOver(out);
}

/* ---------- full screen ---------- */
function realFull() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function fullOn() { return !!(realFull() || S.pseudo || S.vfull); }
/* The browser's Fullscreen API, when it has one that works (PC, Android, iPad). */
function fsApi() {
  const node = $('watch');
  const req = node.requestFullscreen || node.webkitRequestFullscreen;
  const allowed = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  return req && allowed !== false ? req : null;
}
/* iPhone Safari and the X app have no Fullscreen API for a page, but a video can go full screen.
   The canvas is copied into a muted video behind it, and Full screen opens that video in the
   system player. The music keeps playing from the page. */
function setupVideoFull() {
  if (fsApi() || S.fv) return;
  const cv = $('cv');
  const v = document.createElement('video');
  if (typeof v.webkitEnterFullscreen !== 'function' || typeof cv.captureStream !== 'function') return;
  let stream = null;
  try { stream = cv.captureStream(30); } catch (e) { console.warn(e); return; }
  v.id = 'fsv';
  v.muted = true;
  v.defaultMuted = true;
  v.playsInline = true;
  v.setAttribute('muted', '');
  v.setAttribute('playsinline', '');
  v.setAttribute('webkit-playsinline', '');
  v.setAttribute('aria-hidden', 'true');
  v.srcObject = stream;
  cv.parentNode.insertBefore(v, cv);
  S.fv = v;
  const kick = () => { if (v.paused && !S.vfull) { const r = v.play(); if (r && r.catch) r.catch(() => {}); } };
  kick();
  /* Low Power Mode blocks the first start; any tap on the page tries again. */
  window.addEventListener('pointerdown', kick, true);
  v.addEventListener('webkitbeginfullscreen', () => { S.vfull = true; paintFull(); });
  v.addEventListener('webkitendfullscreen', () => { S.vfull = false; paintFull(); setTimeout(kick, 50); });
  /* Pause and play in the system player pause and play the video and the music. */
  v.addEventListener('pause', () => { setTimeout(() => { if (S.vfull && v.paused && S.playing) toggle(); }, 300); });
  v.addEventListener('play', () => { if (S.vfull && !S.playing) toggle(); });
}
function videoFull() {
  const v = S.fv;
  if (!v || v.readyState < 1 || typeof v.webkitEnterFullscreen !== 'function') return false;
  try {
    const r = v.play();
    if (r && r.catch) r.catch(() => {});
    v.webkitEnterFullscreen();
    return true;
  } catch (e) { console.warn(e); return false; }
}
/* S.pseudo is the page's own full screen, the last resort when neither works. */
function paintFull() {
  const on = fullOn();
  $('watch').classList.toggle('is-full', !!(realFull() || S.pseudo));
  $('watch').classList.toggle('pseudo', !!S.pseudo);
  document.body.classList.toggle('lock', !!S.pseudo);
  $('full').textContent = on ? 'Exit' : 'Full screen';
}
function waitFullChange(ms) {
  return new Promise(resolve => {
    const done = () => { document.removeEventListener('fullscreenchange', done); document.removeEventListener('webkitfullscreenchange', done); resolve(); };
    document.addEventListener('fullscreenchange', done);
    document.addEventListener('webkitfullscreenchange', done);
    setTimeout(done, ms);
  });
}
async function enterFull() {
  closeStudio();
  const node = $('watch');
  const req = fsApi();
  /* iPhone: the system player. This must run inside the tap, before any await. */
  if (!req && videoFull()) return;
  if (req) {
    try {
      const r = req.call(node);
      if (r && r.then) await r; else await waitFullChange(700);
    } catch (e) { console.warn(e); }
    if (realFull()) {
      paintFull();
      try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock(S.format === 'pc' ? 'landscape' : 'portrait'); } catch (e) {}
      return;
    }
  }
  S.pseudo = true;
  paintFull();
}
async function exitFull() {
  if (S.pseudo) { S.pseudo = false; paintFull(); return; }
  if (S.vfull && S.fv) {
    try { S.fv.webkitExitFullscreen(); } catch (e) { console.warn(e); }
    return;
  }
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (exit && realFull()) {
    try { const r = exit.call(document); if (r && r.then) await r; } catch (e) { console.warn(e); }
  }
  paintFull();
}
function toggleFull() { return fullOn() ? exitFull() : enterFull(); }

/* ---------- settings panel ---------- */
function studioOpen() { return !$('studio').hidden; }
function closeStudio() {
  const wasOpen = studioOpen();
  $('studio').hidden = true;
  $('backDock').hidden = true;
  $('gear').classList.remove('on');
  $('gear').setAttribute('aria-expanded', 'false');
  if (wasOpen) window.scrollTo(0, 0);
}
function openStudio() {
  window.scrollTo(0, 0);
  document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
  $('studio').hidden = false;
  $('studio').scrollTop = 0;
  $('backDock').hidden = false;
  $('gear').classList.add('on');
  $('gear').setAttribute('aria-expanded', 'true');
}

  $('date').value = Q.get('date') || todayJST();

  $('layout').onchange = () => { if (!Q.get('format')) store.set('layout', $('layout').value); applyLayout(); };
  applyLayout();
  const arm = id => ['applyLine', 'apply', 'go'].forEach(x => $(x).classList.toggle('on', x === id));
  $('go').onclick = () => { arm('go'); runAll({ export: $('autoExport').checked }); };
  $('apply').onclick = () => {
    arm('apply');
    if ($('json').value !== (S.jsonClean || '')) {
      try { setScript(JSON.parse($('json').value), true).catch(e => say(e.message, true)); } catch (e) { say('Could not read the JSON: ' + e.message, true); }
      return;
    }
    refreshMarket();
  };
  $('exportBtn').onclick = () => exportMP4(chosenFormats()).catch(e => { console.error(e); say('Export failed: ' + e.message, true); });
  $('copySrc').onclick = () => {
    const text = $('sources').textContent;
    const done = () => say('Copied the sources.');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => say('Could not copy. Select the text instead.', true));
  };
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    if (Q.get('format') || $('layout').value !== 'auto' || S.busy) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyLayout, 150);
  });
  TRACKS.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.m = t.id;
    b.textContent = t.name;
    b.onclick = () => useTrack(t.id);
    $('music').appendChild(b);
  });
  WALLS.forEach(w => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.w = w.id;
    b.textContent = w.name;
    b.onclick = () => useWall(w.id);
    $('walls').appendChild(b);
  });
  /* The picture is dark unless another colour is chosen (Morning, as on News). It used to start light (Day),
     and the page saved that at every start, so a saved Day is moved to the dark picture once; Day can
     be chosen again in Settings and is then kept. */
  if (store.get('wallV', '') !== '2') { if (store.get('wall', 'day') === 'day') store.set('wall', 'morning'); store.set('wallV', '2'); }
  const requestedWall = Q.get('wall') || store.get('wall', 'morning');
  useWall(WALLS.some(w => w.id === requestedWall) ? requestedWall : 'morning');
  PACES.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.p = String(p.sec);
    b.textContent = p.name;
    b.onclick = () => usePace(p.sec);
    $('paces').appendChild(b);
  });
  const countBox = $('counts');
  const paintCounts = () => countBox.querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.n) === total()));
  COUNTS.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.n = String(n);
    b.textContent = String(n);
    b.onclick = () => {
      if (total() === n) return;
      store.set('count', String(n));
      paintCounts();
      scheduleRefresh(0);
    };
    countBox.appendChild(b);
  });
  paintCounts();
  const themeBox = $('theme');
  const paintTheme = () => {
    document.documentElement.dataset.theme = themeBox.value;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#ffffff');
  };
  const savedTheme = store.get('theme', 'dark');
  themeBox.value = [...themeBox.options].some(o => o.value === savedTheme) ? savedTheme : 'dark';
  paintTheme();
  themeBox.addEventListener('change', () => { store.set('theme', themeBox.value); paintTheme(); });
  const savedPace = Number(Q.get('pace') || store.get('pace', '3.2'));
  usePace(PACES.some(p => p.sec === savedPace) ? savedPace : 3.2);
  const countryBox = $('country');
  const langBox = $('lang');
  COUNTRIES.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; countryBox.appendChild(o); });
  LANGS.forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = l.name; langBox.appendChild(o); });
  const nav = (navigator.language || 'ja').toLowerCase();
  const navCountry = nav.startsWith('en') ? 'US' : 'JP';
  const pickedCountry = COUNTRIES.some(c => c.id === (Q.get('country') || '')) ? Q.get('country')
    : (COUNTRIES.some(c => c.id === store.get('country', '')) ? store.get('country', '') : navCountry);
  countryBox.value = pickedCountry;
  const countryDefault = (COUNTRIES.find(c => c.id === pickedCountry) || COUNTRIES[0]).lang;
  langBox.value = LANGS.some(l => l.id === (Q.get('lang') || '')) ? Q.get('lang')
    : (LANGS.some(l => l.id === store.get('lang', '')) ? store.get('lang', '') : countryDefault);
  /* X comments only is the default. */
  $('feed').value = store.get('feedMode', 'x') === 'news' ? 'news' : 'x';
  $('feed').onchange = () => { store.set('feedMode', $('feed').value); refreshMarket(); };
  saveAccounts(xAccounts());
  $('addX').onclick = addAccount;
  $('xUser').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addAccount(); } });
  const saveMarket = () => { store.set('country', countryBox.value); store.set('lang', langBox.value); };
  buildFilters();
  countryBox.onchange = () => {
    const next = COUNTRIES.find(c => c.id === countryBox.value);
    if (next) langBox.value = next.lang;
    saveMarket();
    refreshMarket();
  };
  langBox.onchange = () => { saveMarket(); refreshMarket(); };
  $('date').onchange = () => scheduleRefresh(0);
  const saved = (store.get('formats', '') || '').split(',').filter(f => FORMATS[f]);
  const on = saved.length ? saved : Object.keys(FORMATS);
  document.querySelectorAll('.fx').forEach(x => { x.checked = on.includes(x.value); x.onchange = () => store.set('formats', chosenFormats().join(',')); });
  $('forget').checked = false;
  $('forget').onchange = () => {
    if (!$('forget').checked) return;
    store.set(SEEN_NEWS, '[]');
    store.set(SEEN_JOKES, '[]');
    store.set('seen', '[]');
    say('Forgot what has played. Stories and jokes can play again.');
    setTimeout(() => { $('forget').checked = false; }, 1200);
  };
  const lineup = $('lineup');
  lineup.value = store.get('lineup', '').split(/\n/).map(noCount).filter(Boolean).join('\n');
  store.set('lineup', lineup.value);
  const paintChips = () => {
    const keys = new Set(lineup.value.split(/\n/).map(chipKey).filter(Boolean));
    document.querySelectorAll('#genreChips button').forEach(b => b.classList.toggle('on', keys.has(b.dataset.line)));
    lineup.classList.toggle('live', !!lineup.value.trim());
  };
  CHIPS.forEach(chip => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = chip.label;
    b.dataset.line = chip.label.toLowerCase();
    b.onclick = () => {
      const lines = lineup.value.split(/\n/).map(s => s.trim()).filter(Boolean);
      const key = chip.label.toLowerCase();
      const idx = lines.findIndex(line => chipKey(line) === key);
      if (idx >= 0) lines.splice(idx, 1);
      else lines.push(chipLine(chip));
      lineup.value = lines.join('\n');
      store.set('lineup', lineup.value);
      paintChips();
      arm('applyLine');
      scheduleRefresh(800);
    };
    $('genreChips').appendChild(b);
  });
  paintChips();
  lineup.addEventListener('input', () => {
    store.set('lineup', lineup.value);
    paintChips();
    $('applyLine').classList.remove('on');
    scheduleRefresh(1500);
  });
  const applyLineup = () => {
    clearTimeout(refreshTimer);
    store.set('lineup', lineup.value);
    paintChips();
    arm('applyLine');
    closeStudio();
    window.scrollTo(0, 0);
    refreshMarket();
  };
  $('applyLine').onclick = applyLineup;
  $('lineupGo').onclick = applyLineup;
  $('play').onclick = toggle;
  /* A tap or click on the picture pauses and plays. */
  $('cv').addEventListener('click', () => toggle());
  $('dl').onclick = () => download();
  $('shareGo').onclick = async () => { const out = shareOut; if (out && await openSheet(out)) closeShare(); };
  $('shareClose').onclick = () => closeShare();
  $('shareBox').addEventListener('click', e => { if (e.target === $('shareBox')) closeShare(); });
  $('full').onclick = () => toggleFull().catch(e => say(e.message || String(e), true));
  $('update').onclick = () => { closeStudio(); refreshMarket(); };
  $('sound').onclick = () => toggleSound();
  paintSound();
  /* With the music on, it starts at the first tap anywhere on the page: a browser allows sound only after one. */
  let askedSound = 0;
  const firstTap = e => {
    if (S.mute || S.audioOn || !S.show || !S.playing) return;
    if (e.target && e.target.closest && e.target.closest('#sound')) return;
    if (performance.now() - askedSound < 500) return;
    askedSound = performance.now();
    playSound(currentT());
  };
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, firstTap, true));
  $('seek').addEventListener('input', () => {
    if (!S.show) return;
    const T = (+$('seek').value / 1000) * S.show.duration;
    if (S.playing) { S.origin = T; S.t0perf = performance.now(); }
    draw(Math.min(T, Math.max(0, S.show.duration - 1 / E.FPS)));
  });
  document.addEventListener('fullscreenchange', paintFull);
  document.addEventListener('webkitfullscreenchange', paintFull);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (studioOpen()) closeStudio();
    else if (S.pseudo) exitFull();
  });
  /* While the system player covers the page, the browser may stop animation frames. Keep drawing. */
  setInterval(() => {
    if (!S.vfull || !S.playing || performance.now() - S.lastDraw < 80) return;
    if (S.raf) { cancelAnimationFrame(S.raf); S.raf = 0; }
    tick();
  }, 40);
  setupVideoFull();
}

/* ---------- start ---------- */
window.NS = { state: () => ({ script: S.script, show: S.show, playing: S.playing, format: S.format }) };
E.setMusicCredit(TRACKS[0].credit);
/* A newer copy on the site: load it, so a copy the browser kept from before is not shown.
   version.json names the latest build of each page; it is read past the browser's cache. */
function watchVersion(key, url) {
  const BUILD = '__BUILD_ID__';
  if (location.protocol === 'file:' || BUILD.indexOf('BUILD_ID') >= 0) return;
  /* At the start it may reload at once; later it waits while a video is being made or saved. */
  const check = first => {
    if (!first && S.busy) { setTimeout(() => check(false), 5000); return; }
    fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).then(v => {
      const now = v && v[key];
      if (!now || now === BUILD) return;
      if (!first && S.busy) { setTimeout(() => check(false), 5000); return; }
      try {
        if (sessionStorage.getItem('reloaded.' + key) === now) return;
        sessionStorage.setItem('reloaded.' + key, now);
      } catch (e) {}
      const u = new URL(location.href);
      u.searchParams.set('v', now);
      location.replace(u.href);
    }).catch(() => {});
  };
  check(true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(false); });
}
/* Back on the page (another app, another tab, the phone's lock screen): the video starts from the top. */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fromTop(); });
window.addEventListener('pageshow', e => { if (e.persisted) fromTop(); });

  if (requested !== first && TRACKS.some(t => t.id === requested)) useTrack(requested);
  else document.querySelectorAll('#music button').forEach(b => b.classList.toggle('on', b.dataset.m === first));
  runAll({ export: false });
}).catch(e => { window.NS.ready = true; say(e.message || String(e), true); });
})();
